<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Learn B-trees one branch at a time: a pre-lecture tutor for COS212."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>B-Tree Basic</title>
    <script>
      // Apply the saved or system theme before first paint to avoid a flash.
      try {
        var saved = JSON.parse(localStorage.getItem('btree-theme') || 'null');
        var theme =
          (saved && saved.state && saved.state.theme) ||
          (matchMedia('(prefers-color-scheme: dark)').matches ? 'dusk' : 'day');
        document.documentElement.dataset.theme = theme;
      } catch (e) {
        document.documentElement.dataset.theme = 'day';
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
